[project]
name = "edu-c2-042"
version = "1.1.3"
description = "EducationLearningResourceMetadataExchangeValidatorAgent — AgentCore Template"
requires-python = ">=3.11"
dependencies = [
    # `openai` extra provides AzureOpenAIClient's dependencies
    # (RemediationGenerateNode's LLM remediation-drafting step);
    # `marketplace` provides the runner's PostgreSQL stack. Fleet-standard
    # pin, matching the pattern used elsewhere in the fleet.
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    # Pinned to match agenticstar-agentcore's own pyyaml==6.0.1 requirement —
    # a different pin here creates an unresolved dependency conflict.
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
# 68.2.2, not the scaffold default 68.0.0 — known scaffold-drift note
# (per-project fix; do not edit the scaffold source itself).
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "yaml"]
ignore_missing_imports = true
